[package]
name = "vanta-comp"
version = "0.1.0"
edition = "2021"

[dependencies]
vanta-ipc = { path = "../vanta-ipc" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "renderer_gl",
]
