[package]
name = "vanta-comp"
version = "0.1.0"
edition = "2021"

[dependencies]
vanta-ipc = { path = "../vanta-ipc" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bitflags = "2"

[dependencies.smithay]
path = "../../../smithay"   # ~/sorabbyngo/sorabbyngo-os/smithay from vanta/
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "renderer_gl",
]
